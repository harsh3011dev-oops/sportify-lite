version: '3.8'

services:
  # 1. n8n Automation Engine
  n8n:
    image: n8nio/n8n:latest
    container_name: sportify_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=sportify_n8n_pass
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
      - ./workers:/app/workers
      - ./scripts:/app/scripts
      - ./storage_datastore:/app/storage_datastore
    depends_on:
      - postgres
      - redis

  # 2. PostgreSQL Metadata Database
  postgres:
    image: postgres:15-alpine
    container_name: sportify_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sportify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 3. Redis Cache & BullMQ Job Queue
  redis:
    image: redis:7-alpine
    container_name: sportify_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  n8n_data:
  postgres_data:
  redis_data:
